<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOLIO · YouTube 재생 테스트</title><style>

<body><main><p class="over">FOLIO / VIDEO DIAGNOSTICS</p><h1>영우 · 유튜브 테마곡</h1><p>업로드된 홈페이지에서 아래 플레이어가 표시되고 재생되는지 확인하세요. 200×200 크기의 유튜브 공식 플레이어입니다.</p>
<div class="panel"><b>접속 환경</b><div id="origin" class="pill"></div><small id="note"></small></div>
<iframe id="player" width="200" height="200" title="영우 · 葛东琪 囍" src="https://www.youtube.com/embed/AMEv4ncoQxg?playsinline=1&controls=1&rel=0" loading="eager" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

<p><small>플레이어가 보이지만 소리가 나오지 않으면 영상의 ▶ 버튼을 직접 눌러보세요. 브라우저가 소리 있는 자동재생을 제한할 수 있습니다. 영상 소유자가 외부 삽입을 금지한 경우에도 재생되지 않을 수 있습니다.</small></p><hr><a class="action" href="./#/character/yeongu">← 영우 프로필로 돌아가기</a>
</main><script>
const player=document.getElementById('player');document.getElementById('origin').textContent=location.origin==='null'?'파일 미리보기 (file://)':location.origin;

document.getElementById('start').addEventListener('click',()=>{player.src='https://www.youtube.com/embed/AMEv4ncoQxg?autoplay=1&playsinline=1&controls=1&rel=0';});
